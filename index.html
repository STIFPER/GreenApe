                e("h4", { className: "font-bd font-bold text-lg text-[#1a2542] mb-0.5 leading-tight" }, "Trusted Quality"),
                e("p", { className: "font-yellix text-sm font-semibold text-[#1a2542]/60 leading-snug" }, "Lab-tested & manufactured from ISO and GHP Certified Facility.")
              )
            )
          ),
          // Bottom row
          e("div", { className: "flex flex-col xl:flex-row xl:items-end justify-between gap-6" },
            e("div", { className: "bg-white/50 backdrop-blur-sm rounded-2xl p-5 shadow-sm border border-white/60 flex-1" },
              e("span", { className: "font-yellix font-bold text-xs uppercase tracking-widest text-[#1a2542]/60 block mb-3" }, "May help with"),
              e("div", { className: "flex flex-wrap gap-2" },
                e("span", { className: "bg-[#2a1962] text-white font-bd text-sm px-4 py-1.5 rounded-xl shadow-sm" }, "Better Sleep"),
                e("span", { className: "bg-[#2a1962] text-white font-bd text-sm px-4 py-1.5 rounded-xl shadow-sm" }, "Pain Relief"),
                e("span", { className: "bg-[#2a1962] text-white font-bd text-sm px-4 py-1.5 rounded-xl shadow-sm" }, "Stress & Anxiety")
              )
            ),
            e("div", { className: "text-center xl:text-right shrink-0 bg-gradient-to-r from-[#2a1962] to-[#4a3982] p-6 rounded-[1.5rem] shadow-[0_10px_25px_rgba(42,25,98,0.4)] border border-white/20 flex flex-col items-center xl:items-end justify-center w-full xl:w-auto relative overflow-hidden group hover:scale-[1.02] transition-transform duration-300" },
              e("div", { className: "absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -mr-12 -mt-12 blur-2xl" }),
              e("span", { className: "font-yellix font-bold text-xs md:text-sm text-white/70 uppercase tracking-[0.2em] block mb-2 relative z-10" }, "Special Price"),
              e("div", { className: "font-bd font-black text-5xl md:text-6xl text-[#c6dc3b] drop-shadow-md leading-none relative z-10 flex items-baseline" },
                e("span", { className: "text-3xl md:text-4xl opacity-90 mr-1.5 text-white/90" }, "฿"),
                "1,800"
              )
            )
          )
        )
      );

      // อัปเดต Path รูปภาพ promo-popup.png ให้อยู่ในโฟลเดอร์ assets/
      const PromoModal = ({ isOpen, onClose }) => {
        if (!isOpen) return null;

        return e("div", { className: "fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/40 backdrop-blur-xl animate-fadeIn", onClick: onClose },
          e("div", { className: "relative max-w-md md:max-w-lg w-full animate-popup", onClick: (e) => e.stopPropagation() },
            e("button", { onClick: onClose, className: "absolute -top-3 -right-3 md:-top-5 md:-right-5 bg-[#e8246e] text-white rounded-full w-8 h-8 md:w-10 md:h-10 flex items-center justify-center font-bold text-xl md:text-2xl shadow-xl border-2 border-white hover:scale-110 transition-transform z-10" }, "\u00D7"),
            e("img", { src: "assets/promo-popup.png", alt: "Special Promotion", className: "w-full h-auto rounded-2xl shadow-2xl object-contain bg-black/20" })
          )
        );
      };

      const App = () => {
        const SHOW_COMPOUND_GENETICS = true;
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [showPromoModal, setShowPromoModal] = useState(true);

        const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        const currentDate = new Date();
        const currentMonthYear = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

        const sativa = products.filter((p) => p.cat === "SATIVA");
        const indica = products.filter((p) => p.cat === "INDICA");
        const hybrid = products.filter((p) => p.cat === "HYBRID");
        const cbd = products.filter((p) => p.cat === "CBD");
        const compoundGenetics = products.filter((p) => p.cat === "COMPOUND_GENETICS");

        const allSections = [
          { id: "sativa", title: "SATIVA", color: "#9e9e5e", data: sativa },
          { id: "indica", title: "INDICA", color: "#4a5585", data: indica },
          { id: "hybrid", title: "HYBRID", color: "#9e7b5e", data: hybrid },
          { id: "cbd", title: "CBD", color: "#9e5e97", data: cbd },
        ];

        if (SHOW_COMPOUND_GENETICS) {
          allSections.push({ id: "compound", title: "COMPOUND GENETICS", color: "#112237", data: compoundGenetics, isCompound: true });
        }

        const activeSections = allSections.filter((s) => s.data.length > 0);

        let leftCol = [];
        let rightCol = [];
        let leftWeight = 0;
        let rightWeight = 0;

        activeSections.forEach((section) => {
          const weight = section.data.length + 1.5;
          if (leftWeight <= rightWeight) {
            leftCol.push(section);
            leftWeight += weight;
          } else {
            rightCol.push(section);
            rightWeight += weight;
          }
        });

        const renderSection = (section) => e("div", { key: section.id, className: `border rounded-2xl shadow-xl overflow-hidden flex flex-col mb-6 ${section.isCompound ? "border-[#c8c7c7]/30 shadow-[0_10px_30px_rgba(17,34,55,0.8)] bg-[#112237]" : "border-white/20 bg-black/20 backdrop-blur-sm"}` },
          e(BoxHeader, { title: section.title, bgColor: section.color, isCompound: section.isCompound }),
          e("div", { className: "p-3 space-y-1" },
            section.data.map((p, idx) => e(ProductCard, { key: idx, product: p, onClick: setSelectedProduct, theme: section.isCompound ? "compound" : "default" }))
          )
        );

        return e("div", { className: "min-h-screen flex flex-col pb-10 relative" },
          e(PromoModal, { isOpen: showPromoModal, onClose: () => setShowPromoModal(false) }),
          // อัปเดต Path รูปภาพ logo.png ให้อยู่ในโฟลเดอร์ assets/
          e("header", { className: "max-w-[1400px] mx-auto w-full px-4 pt-8 pb-6 text-center flex flex-col items-center justify-center gap-3" },
            e("img", { src: "assets/Green Ape Logo", alt: "Green Ape Logo", className: "h-10 md:h-12 w-auto max-w-[110px] object-contain drop-shadow-md hover:scale-105 transition-transform duration-300" }),
            e("h1", { className: "font-bd font-black text-[40px] md:text-[48px] text-primary uppercase leading-none tracking-tight drop-shadow-lg text-primary" }, "FLOWER MENU"),
            e("p", { className: "font-bd font-bold text-sm md:text-base text-white uppercase tracking-[0.2em] bg-tertiary px-6 py-1.5 rounded-full shadow-lg" }, currentMonthYear)
          ),
          e("main", { className: "flex flex-col md:flex-row gap-6 max-w-[1400px] mx-auto w-full px-4 mb-4 items-start" },
            e("div", { className: "w-full md:w-1/2 flex flex-col" }, leftCol.map(renderSection)),
            e("div", { className: "w-full md:w-1/2 flex flex-col" }, rightCol.map(renderSection))
          ),
          e("section", { className: "max-w-[1400px] mx-auto w-full px-4" }, e(PartyPackPromo)),
          e("section", { className: "max-w-[1400px] mx-auto w-full px-4" }, e(PreRollsPromo)),
          e("section", { className: "max-w-[1400px] mx-auto w-full px-4" }, e(CbdOilPromo)),
          !showPromoModal && e("button", { onClick: () => setShowPromoModal(true), className: "fixed bottom-6 right-6 md:bottom-8 md:right-8 bg-[#e8246e] text-white px-4 py-3 rounded-full shadow-[0_4px_20px_rgba(232,36,110,0.5)] flex items-center justify-center gap-2 hover:scale-110 transition-transform duration-300 z-40 border border-white/30 group animate-popup" },
            e(SvgPromoOffer),
            e("span", { className: "font-bd font-bold text-sm md:text-base uppercase tracking-widest mt-0.5 drop-shadow-sm" }, "Offers")
          )
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(e(App));
    </script>
  </body>
</html>
