                            <PartyPackPromo className="flex md:hidden" />
                        </div>
                    </main>

                    {/* NEW: PRE-ROLLS SECTION FULL WIDTH AT BOTTOM */}
                    <section className="max-w-[1400px] mx-auto w-full px-4">
                        <PreRollsPromo />
                    </section>

                    {/* NEW: CBD OIL PROMO SECTION */}
                    <section className="max-w-[1400px] mx-auto w-full px-4">
                        <CbdOilPromo />
                    </section>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
