                        {/* Benefits Tags */}
                        <div className="bg-white/50 backdrop-blur-sm rounded-2xl p-5 shadow-sm border border-white/60 flex-1">
                            <span className="font-yellix font-bold text-xs uppercase tracking-widest text-[#1a2542]/60 block mb-3">May help with</span>
                            <div className="flex flex-wrap gap-2">
                                <span className="bg-[#2a1962] text-white font-bd text-sm px-4 py-1.5 rounded-xl shadow-sm">Better Sleep</span>
                                <span className="bg-[#2a1962] text-white font-bd text-sm px-4 py-1.5 rounded-xl shadow-sm">Pain Relief</span>
                                <span className="bg-[#2a1962] text-white font-bd text-sm px-4 py-1.5 rounded-xl shadow-sm">Stress & Anxiety</span>
                            </div>
                        </div>

                        {/* Price - RE-DESIGNED TO STAND OUT */}
                        <div className="text-center xl:text-right shrink-0 bg-gradient-to-r from-[#2a1962] to-[#4a3982] p-6 rounded-[1.5rem] shadow-[0_10px_25px_rgba(42,25,98,0.4)] border border-white/20 flex flex-col items-center xl:items-end justify-center w-full xl:w-auto relative overflow-hidden group hover:scale-[1.02] transition-transform duration-300">
                            {/* Decorative element background */}
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -mr-12 -mt-12 blur-2xl"></div>
                            
                            <span className="font-yellix font-bold text-xs md:text-sm text-white/70 uppercase tracking-[0.2em] block mb-2 relative z-10">Special Price</span>
                            <div className="font-bd font-black text-5xl md:text-6xl text-[#c6dc3b] drop-shadow-md leading-none relative z-10 flex items-baseline">
                                <span className="text-3xl md:text-4xl opacity-90 mr-1.5 text-white/90">฿</span>1,800
                            </div>
                        </div>
                        
                    </div>

                </div>
            </div>
        );

        // NEW COMPONENT: Popup Modal สำหรับโปรโมชั่น
        const PromoModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/40 backdrop-blur-xl animate-fadeIn" onClick={onClose}>
                    {/* กล่องใส่รูป */}
                    <div className="relative max-w-md md:max-w-lg w-full animate-popup" onClick={(e) => e.stopPropagation()}>
                        
                        {/* ปุ่มปิด (X) */}
                        <button 
                            onClick={onClose}
                            className="absolute -top-3 -right-3 md:-top-5 md:-right-5 bg-[#e8246e] text-white rounded-full w-8 h-8 md:w-10 md:h-10 flex items-center justify-center font-bold text-xl md:text-2xl shadow-xl border-2 border-white hover:scale-110 transition-transform z-10"
                        >
                            &times;
                        </button>

                        {/* รูปโปรโมชั่น */}
                        <img 
                            src="promo-popup.png" 
                            alt="Special Promotion" 
                            className="w-full h-auto rounded-2xl shadow-2xl object-contain bg-black/20"
                        />
                    </div>
                </div>
            );
        };

        const App = () => {
            // ==========================================
            // ตั้งค่าเปิด-ปิด แสดงกรอบ COMPOUND GENETICS
            // ==========================================
            const SHOW_COMPOUND_GENETICS = true;

            const [selectedProduct, setSelectedProduct] = useState(null);
            const [showPromoModal, setShowPromoModal] = useState(true);

            // Auto update month and year
            const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
            const currentDate = new Date();
            const currentMonthYear = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

            // Filter Products
            const sativa = products.filter(p => p.cat === 'SATIVA');
            const indica = products.filter(p => p.cat === 'INDICA');
            const hybrid = products.filter(p => p.cat === 'HYBRID');
            const cbd = products.filter(p => p.cat === 'CBD');
            const compoundGenetics = products.filter(p => p.cat === 'COMPOUND_GENETICS');

            // --- AUTO BALANCE LAYOUT ALGORITHM ---
            // รวบรวมหมวดหมู่ทั้งหมดที่มีอยู่
            const allSections = [
                { id: 'sativa', title: 'SATIVA', color: '#9e9e5e', data: sativa },
                { id: 'indica', title: 'INDICA', color: '#4a5585', data: indica },
                { id: 'hybrid', title: 'HYBRID', color: '#9e7b5e', data: hybrid },
                { id: 'cbd', title: 'CBD', color: '#9e5e97', data: cbd },
            ];

            // เพิ่ม Compound Genetics ถ้าตั้งค่าเปิดไว้
            if (SHOW_COMPOUND_GENETICS) {
                allSections.push({ 
                    id: 'compound', 
                    title: 'COMPOUND GENETICS', 
                    color: '#112237', 
                    data: compoundGenetics, 
                    isCompound: true 
                });
            }

            // กรองเอาเฉพาะหมวดที่มีสินค้า
            const activeSections = allSections.filter(s => s.data.length > 0);

            // คำนวณเพื่อกระจายกล่องไปคอลัมน์ซ้าย-ขวา ให้ความสูงใกล้เคียงกันที่สุด
            let leftCol = [];
            let rightCol = [];
            let leftWeight = 0;
            let rightWeight = 0;

            activeSections.forEach(section => {
                // น้ำหนักโดยประมาณ (1 สินค้า = 1 ส่วน, หัวข้อ = 1.5 ส่วน)
                const weight = section.data.length + 1.5; 
                
                if (leftWeight <= rightWeight) {
                    leftCol.push(section);
                    leftWeight += weight;
                } else {
                    rightCol.push(section);
                    rightWeight += weight;
                }
            });

            // ฟังก์ชันสำหรับสร้างกล่องหมวดหมู่
            const renderSection = (section) => (
                <div key={section.id} className={`border rounded-2xl shadow-xl overflow-hidden flex flex-col mb-6 ${section.isCompound ? 'border-[#c8c7c7]/30 shadow-[0_10px_30px_rgba(17,34,55,0.8)] bg-[#112237]' : 'border-white/20 bg-black/20 backdrop-blur-sm'}`}>
                    <BoxHeader title={section.title} bgColor={section.color} isCompound={section.isCompound} />
                    <div className="p-3 space-y-1">
                        {section.data.map((p, idx) => (
                            <ProductCard key={idx} product={p} onClick={setSelectedProduct} theme={section.isCompound ? 'compound' : 'default'} />
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col pb-10 relative">
                    
                    {/* เรียกใช้ Popup Modal */}
                    <PromoModal isOpen={showPromoModal} onClose={() => setShowPromoModal(false)} />

                    {/* Header */}
                    <header className="max-w-[1400px] mx-auto w-full px-4 pt-8 pb-6 text-center flex flex-col items-center justify-center gap-3">
                        <img 
                            src="logo.png" 
                            alt="Green Ape Logo" 
                            className="h-10 md:h-12 w-auto max-w-[110px] object-contain drop-shadow-md hover:scale-105 transition-transform duration-300"
                        />
                        <h1 className="font-bd font-black text-[40px] md:text-[48px] text-primary uppercase leading-none tracking-tight drop-shadow-lg">FLOWER MENU</h1>
                        <p className="font-bd font-bold text-sm md:text-base text-white uppercase tracking-[0.2em] bg-tertiary px-6 py-1.5 rounded-full shadow-lg">{currentMonthYear}</p>
                    </header>

                    {/* CONTENT GRID (รายการดอกไม้) - ใช้ระบบ Auto Balance */}
                    <main className="flex flex-col md:flex-row gap-6 max-w-[1400px] mx-auto w-full px-4 mb-4 items-start">
                        
                        {/* LEFT COLUMN */}
                        <div className="w-full md:w-1/2 flex flex-col">
                            {leftCol.map(renderSection)}
                        </div>

                        {/* RIGHT COLUMN */}
                        <div className="w-full md:w-1/2 flex flex-col">
                            {rightCol.map(renderSection)}
                        </div>
                        
                    </main>

                    {/* NEW: PARTY PACK PROMO SECTION - Full Width Banner แบบเต็นจอ */}
                    <section className="max-w-[1400px] mx-auto w-full px-4">
                        <PartyPackPromo />
                    </section>

                    {/* NEW: PRE-ROLLS SECTION FULL WIDTH AT BOTTOM */}
                    <section className="max-w-[1400px] mx-auto w-full px-4">
                        <PreRollsPromo />
                    </section>

                    {/* NEW: CBD OIL PROMO SECTION */}
                    <section className="max-w-[1400px] mx-auto w-full px-4">
                        <CbdOilPromo />
                    </section>

                    {/* Floating Promo Button - ปุ่มกดเรียกโปรโมชั่นที่มุมล่างขวา */}
                    {!showPromoModal && (
                        <button
                            onClick={() => setShowPromoModal(true)}
                            className="fixed bottom-6 right-6 md:bottom-8 md:right-8 bg-[#e8246e] text-white px-4 py-3 rounded-full shadow-[0_4px_20px_rgba(232,36,110,0.5)] flex items-center justify-center gap-2 hover:scale-110 transition-transform duration-300 z-40 border border-white/30 group animate-popup"
                        >
                            <SvgPromoOffer />
                            <span className="font-bd font-bold text-sm md:text-base uppercase tracking-widest mt-0.5 drop-shadow-sm">Offers</span>
                        </button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
