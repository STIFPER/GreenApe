      @keyframes hwSway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

      }

        50% { filter: drop-shadow(0 0 7px rgba(255, 117, 24, 0.95)); }
      }
      @keyframes hwIdle {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-3px) rotate(2.5deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-2px) rotate(-2.5deg); }
      }

        0%, 35%, 100% { transform: translateX(0); }
        45%, 65% { transform: translateX(-1.8px); }
        75%, 90% { transform: translateX(1.8px); }
      }

      @keyframes hwFog { 0% { transform: translateX(-10%); } 100% { transform: translateX(40%); } }
      .hw-sway { transform-origin: 50% 0; animation: hwSway 4s ease-in-out infinite; }
      .hw-float { animation: hwFloat 3.4s ease-in-out infinite; }
      .hw-jump { animation: hwJump 0.7s ease-out; }

      const HW_SVG = {

        // ผีลิง: มีหู ตางัวเงีย สวมแว่นกอกเกิล
        ghost: `<svg viewBox="0 0 70 72" style="display:block;width:100%;height:auto"><circle cx="8" cy="36" r="7" fill="#f5f0ff" stroke="#1b1040" stroke-width="3"/><circle cx="62" cy="36" r="7" fill="#f5f0ff" stroke="#1b1040" stroke-width="3"/><circle cx="8" cy="36" r="3" fill="#ff7bb0" fill-opacity=".7"/><circle cx="62" cy="36" r="3" fill="#ff7bb0" fill-opacity=".7"/><path d="M35 4C19 4 13 18 13 32L13 62L21 54L28 64L35 54L42 64L49 54L57 62L57 32C57 18 51 4 35 4Z" fill="#f5f0ff" stroke="#1b1040" stroke-width="3" stroke-linejoin="round"/><path d="M22 40A5 5 0 0 1 32 40ZM38 40A5 5 0 0 1 48 40Z" fill="#1b1040"/><path d="M31 48Q35 51 39 48" fill="none" stroke="#1b1040" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="46" r="2.6" fill="#ff7bb0" fill-opacity=".6"/><circle cx="50" cy="46" r="2.6" fill="#ff7bb0" fill-opacity=".6"/>${hwGoggles(15.5, 10, 0.62, -6)}</svg>`,
        // กะโหลกสวมแว่นกอกเกิล
        skull: `<svg viewBox="0 0 60 64" style="display:block;width:100%;height:auto"><path d="M30 4C14 4 6 16 6 28C6 36 10 40 16 43L16 54L44 54L44 43C50 40 54 36 54 28C54 16 46 4 30 4Z" fill="#f5f0ff" stroke="#1b1040" stroke-width="3" stroke-linejoin="round"/><ellipse cx="21" cy="31" rx="6" ry="7" fill="#1b1040"/><ellipse cx="39" cy="31" rx="6" ry="7" fill="#1b1040"/><path d="M30 39L26 46L34 46Z" fill="#1b1040"/><path d="M23 54L23 49M30 54L30 49M37 54L37 49" stroke="#1b1040" stroke-width="2.5" stroke-linecap="round"/>${hwGoggles(11, 5, 0.8, -8)}</svg>`,
        // หม้อต้มยาเขียวของ Green Ape
        cauldron: `<svg viewBox="0 0 70 64" style="display:block;width:100%;height:auto"><path d="M10 26C8 48 18 58 35 58C52 58 62 48 60 26Z" fill="#34236b" stroke="#1b1040" stroke-width="3" stroke-linejoin="round"/><path d="M20 58L17 63M50 58L53 63" stroke="#1b1040" stroke-width="4" stroke-linecap="round"/><ellipse cx="35" cy="26" rx="27" ry="7" fill="#1b1040"/><ellipse cx="35" cy="26" rx="23" ry="5" fill="#c6dc3b"/><circle cx="28" cy="15" r="4.2" fill="#c6dc3b" stroke="#1b1040" stroke-width="1.6"/><circle cx="42" cy="10" r="3.2" fill="#c6dc3b" stroke="#1b1040" stroke-width="1.6"/><circle cx="35" cy="4" r="2.4" fill="#c6dc3b" stroke="#1b1040" stroke-width="1.4"/><path d="M16 36C18 44 22 50 28 53" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/></svg>`,
        moon: `<svg viewBox="0 0 60 60" style="display:block;width:100%;height:auto"><path d="M38 5C22 7 11 20 11 35C11 48 21 56 33 56C41 56 48 52 52 46C38 48 27 38 27 26C27 18 31 10 38 5Z" fill="#ffe066" stroke="#1b1040" stroke-width="3" stroke-linejoin="round"/><circle cx="21" cy="40" r="2.5" fill="#1b1040" fill-opacity=".25"/><circle cx="30" cy="49" r="1.8" fill="#1b1040" fill-opacity=".25"/></svg>`,
        // หมวกแม่มดวางบนตัวอักษร FLOWER MENU

        // เถาวัลย์ป่าห้อยลงมา

        // ตาเรืองแสงในความมืด
        eyes: `<svg viewBox="0 0 50 20" style="display:block;width:100%;height:auto"><ellipse cx="12" cy="10" rx="9" ry="6" fill="#c6dc3b"/><ellipse cx="38" cy="10" rx="9" ry="6" fill="#c6dc3b"/><ellipse cx="12" cy="10" rx="1.8" ry="5" fill="#0f0826"/><ellipse cx="38" cy="10" rx="1.8" ry="5" fill="#0f0826"/></svg>`,
      };

      // ไอคอนข้างชื่อหัวหมวด
      const HW_EMBLEM = {
        sativa: "pumpkin",
        indica: "moon",
        hybrid: "cauldron",
        compound: "skull",
      };

      const HwArt = ({ name, className, style }) =>
        e("span", {
          "aria-hidden": "true",
          className,
          style,
          dangerouslySetInnerHTML: { __html: HW_SVG[name] },
        });

      // เมือกสีเขียวมะนาวหยดลงมา (ทำซ้ำแนวนอน)
      const HwDrip = ({ className, size }) =>
        e("span", {
          "aria-hidden": "true",
          className,
          style: {
            backgroundImage: `url("data:image/svg+xml,${encodeURIComponent(HW_DRIP_SVG)}")`,
            backgroundRepeat: "repeat-x",
            backgroundSize: size || "32px 16px",
          },
        });

      const HalloweenSky = () =>
        e(
          "div",
          {
            "aria-hidden": "true",
            className:
              "absolute inset-x-0 top-0 h-[300px] overflow-hidden pointer-events-none",
            style: {
              background:
                "radial-gradient(ellipse at 50% 0%, rgba(255,117,24,.2), transparent 62%)",
            },
          },
          e(HwDrip, {
            className: "absolute top-0 inset-x-0 h-[28px]",
            size: "56px 28px",
          }),
          e("span", { className: "hw-fog" }),
          e(
            "span",
            {
              className: "hw-eyes absolute",
              style: { right: "4%", top: "60%", width: 34 },
            },
            e(HwArt, { name: "eyes", className: "block" }),
          ),
          e(
            "span",
            {
              className: "hw-eyes absolute hidden md:block",
              style: { left: "7%", top: "64%", width: 40, animationDelay: "-2s" },
            },
            e(HwArt, { name: "eyes", className: "block" }),
          ),
        );

      // ฟักทองที่กดได้ — กดแล้วกระโดดและขึ้นคำว่า BOO!
      const HwBooPumpkin = ({ className, tilt, idleDur, idleDelay }) => {
        const [boo, setBoo] = useState(false);
        const pop = () => {
          setBoo(true);
          setTimeout(() => setBoo(false), 1200);
        };
        return e(
          "button",
          {
            type: "button",
            "aria-label": "Boo!",
            onClick: pop,
            className: `${className} cursor-pointer`,
            style: { background: "transparent", border: 0, padding: 0 },
          },
          e(
            "span",
            {
        className: boo ? "hw-jump block" : "hw-idle block",
        style: boo
          ? undefined
          : { animationDuration: idleDur, animationDelay: idleDelay },
      },
            e(HwArt, {
              name: "pumpkin",
              className: "block",
              style: { transform: `rotate(${tilt}deg)` },
            }),
          ),
          boo && e("span", { className: "hw-boo" }, "BOO!"),
        );
      };

      const HalloweenHeaderArt = () =>
        e(
          React.Fragment,
          null,
          e(HwBooPumpkin, {
            className: "absolute top-[99px] md:top-[88px] left-2 md:left-[16%] block w-11 md:w-24",
            tilt: -10,
      idleDur: "5.2s",
      idleDelay: "0s",
          }),
          e(HwBooPumpkin, {
            className: "absolute top-[99px] md:top-[88px] right-2 md:right-[16%] block w-11 md:w-24",
            tilt: 10,
      idleDur: "4.6s",
      idleDelay: "-2.3s",
          }),
          e(HwArt, {
            name: "ghost",
            className:
              "hw-float absolute bottom-2 left-4 md:left-[27%] block w-10 md:w-14",
          }),
          e(HwArt, {
            name: "vine",
            className:
              "hw-sway absolute top-0 left-[17%] md:left-[28%] block w-8 md:w-16",
          }),
          e(HwArt, {
            name: "vine",
            className:
              "hw-sway absolute top-0 right-[17%] md:right-[28%] block w-8 md:w-16",
            style: { transform: "scaleX(-1)" },
          }),
          e(HwArt, {
            name: "hat",
            className:
              "absolute block w-8 md:w-11 left-[calc(50%+78px)] md:left-[calc(50%+112px)] top-[72px] md:top-[68px]",
            style: { transform: "rotate(14deg)" },
          }),
        );

      const HalloweenStrip = () =>
        e(
          "div",
          {
            "aria-hidden": "true",
            className:
              "max-w-[1400px] mx-auto w-full px-4 my-4 flex items-center gap-3",
          },
          e("span", { className: "flex-1 h-px bg-[#c6dc3b]/40" }),
          e(HwArt, { name: "ghost", className: "block w-8" }),
          e(HwArt, { name: "pumpkin", className: "block w-10" }),
          e(HwArt, { name: "cauldron", className: "block w-10" }),
          e(HwArt, { name: "pumpkin", className: "block w-10" }),
          e(HwArt, { name: "ghost", className: "block w-8" }),
          e("span", { className: "flex-1 h-px bg-[#c6dc3b]/40" }),
        );
      // ===== HALLOWEEN END =====

      const App = () => {
        const SHOW_COMPOUND_GENETICS = true;
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [showPromoModal, setShowPromoModal] = useState(true);

        const monthNames = [
          "JANUARY",
          "FEBRUARY",
          "MARCH",
          "APRIL",
          "MAY",
          "JUNE",
          "JULY",
          "AUGUST",
          "SEPTEMBER",
          "OCTOBER",
          "NOVEMBER",
          "DECEMBER",
        ];
        const currentDate = new Date();
        const currentMonthYear = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

        const stockRank = (p) => {
          const has1 = p.stock1 !== false;
          const has35 = p.stock35 !== false;
          if (has1 && has35) return 0;
          if (has1 && !has35) return 1;
          if (!has1 && has35) return 2;
          return 3;
        };
        const tagRank = (p) => {
          const tags = p.tags || [];
          if (tags.includes("BEST SELLER")) return 0;
          if (tags.includes("NEW")) return 1;
          return 2;
        };
        const forMenu = (cat) =>
          products
            .filter((p) => p.cat === cat && stockRank(p) !== 3)
            .sort((a, b) => {
              const tagDiff = tagRank(a) - tagRank(b);
              if (tagDiff !== 0) return tagDiff;
              return stockRank(a) - stockRank(b);
            });

        const sativa = forMenu("SATIVA");
        const indica = forMenu("INDICA");
        const hybrid = forMenu("HYBRID");
        const cbd = forMenu("CBD");
        const compoundGenetics = forMenu("COMPOUND_GENETICS");

        const allSections = [
          { id: "sativa", title: "SATIVA", color: "#9e9e5e", data: sativa },
          { id: "indica", title: "INDICA", color: "#4a5585", data: indica },
          { id: "hybrid", title: "HYBRID", color: "#9e7b5e", data: hybrid },
          { id: "cbd", title: "CBD", color: "#9e5e97", data: cbd },
        ];

        if (SHOW_COMPOUND_GENETICS) {
          allSections.push({
            id: "compound",
            title: "COMPOUND GENETICS",
            color: "#112237",
            data: compoundGenetics,
            isCompound: true,
          });
        }

        const activeSections = allSections.filter((s) => s.data.length > 0);

        const renderSection = (section) =>
          e(
            "div",
            {
              key: section.id,
              className: `border rounded-2xl shadow-xl overflow-hidden flex flex-col mb-6 break-inside-avoid ${SHOW_HALLOWEEN ? "relative hw-glow" : ""} ${section.isCompound ? "border-[#c8c7c7]/30 shadow-[0_10px_30px_rgba(17,34,55,0.8)] bg-[#112237]" : SHOW_HALLOWEEN ? "border-[#c6dc3b]/35 bg-black/20 backdrop-blur-sm" : "border-white/20 bg-black/20 backdrop-blur-sm"}`,
            },
            e(BoxHeader, {
              title: section.title,
              bgColor: section.color,
              isCompound: section.isCompound,
              // HALLOWEEN: ไอคอนข้างชื่อหมวด
              extra:
                SHOW_HALLOWEEN && HW_EMBLEM[section.id]
                  ? e(HwArt, {
                      name: HW_EMBLEM[section.id],
                      className: "block w-6 shrink-0",
                    })
                  : null,
              // HALLOWEEN: เมือกเขียวหยดจากหัวการ์ด
              deco: SHOW_HALLOWEEN
                ? e(HwDrip, {
                    className:
                      "absolute left-0 right-0 -bottom-[16px] h-[16px] z-10",
                  })
                : null,
            }),
            e(
              "div",
              { className: "p-3 space-y-1" },
              section.data.map((p, idx) =>
                e(ProductCard, {
                  key: idx,
                  product: p,
                  onClick: setSelectedProduct,
                  theme: section.isCompound ? "compound" : "default",
                }),
              ),
            ),
          );

        return e(
          "div",
          { className: "min-h-screen flex flex-col pb-10 relative" },
          // HALLOWEEN: ฉากหลัง (ใยแมงมุม + ค้างคาวบิน)
          SHOW_HALLOWEEN && e(HalloweenSky),
          e(PromoModal, {
            isOpen: showPromoModal,
            onClose: () => setShowPromoModal(false),
          }),
          // อัปเดต Path รูปภาพ logo.png ให้อยู่ในโฟลเดอร์ assets/
          e(
            "header",
            {
              className: `max-w-[1400px] mx-auto w-full px-4 pt-8 pb-6 text-center flex flex-col items-center justify-center gap-3${SHOW_HALLOWEEN ? " relative" : ""}`,
            },
            // HALLOWEEN: ข้อความต้อนรับเหนือโลโก้
            SHOW_HALLOWEEN &&
              e(
                "p",
                {
                  className:
                    "font-bd font-bold text-[10px] md:text-xs text-[#ff7518] uppercase tracking-[0.35em] -mb-1",
                },
                "Happy Ape-loween",
              ),
            e("img", {
              src: "assets/Green Ape Logo.png",
              alt: "Green Ape Logo",
              className:
                "h-8 md:h-10 w-auto max-w-[220px] object-contain drop-shadow-md hover:scale-105 transition-transform duration-300",
            }),
            e(
              "h1",
              {
                className:
                  "font-bd font-black text-[40px] md:text-[48px] text-primary uppercase leading-none tracking-tight drop-shadow-lg text-primary",
              },
              "FLOWER MENU",
            ),
            e(
              "p",
              {
                className: `font-bd font-bold text-sm md:text-base uppercase tracking-[0.2em] px-6 py-1.5 rounded-full shadow-lg ${SHOW_HALLOWEEN ? "bg-[#ff7518] text-[#1b1040]" : "bg-tertiary text-white"}`,
              },
              currentMonthYear,
            ),
            // HALLOWEEN: ฟักทอง ผี แมงมุมที่หัวเว็บ
            SHOW_HALLOWEEN && e(HalloweenHeaderArt),
          ),
          e(
            "main",
            {
              className:
                "max-w-[1400px] mx-auto w-full px-4 mb-4 md:columns-2 md:gap-6",
            },
            activeSections.map(renderSection),
          ),
          // HALLOWEEN: แถบคั่น
          SHOW_HALLOWEEN && e(HalloweenStrip),
          e(
            "section",
            { className: "max-w-[1400px] mx-auto w-full px-4" },
            e(PartyPackPromo),
          ),
          e(
            "section",
            { className: "max-w-[1400px] mx-auto w-full px-4" },
            e(PreRollsPromo),
          ),
          e(
            "section",
            { className: "max-w-[1400px] mx-auto w-full px-4" },
            e(CbdOilPromo),
          ),
          // HALLOWEEN: แถบคั่นท้ายหน้า
          SHOW_HALLOWEEN && e(HalloweenStrip),
          !showPromoModal &&
            e(
              "button",
              {
                onClick: () => setShowPromoModal(true),
                className:
                  "fixed bottom-6 right-6 md:bottom-8 md:right-8 bg-[#e8246e] text-white px-4 py-3 rounded-full shadow-[0_4px_20px_rgba(232,36,110,0.5)] flex items-center justify-center gap-2 hover:scale-110 transition-transform duration-300 z-40 border border-white/30 group animate-popup",
              },
              e(SvgPromoOffer),
              e(
                "span",
                {
                  className:
                    "font-bd font-bold text-sm md:text-base uppercase tracking-widest mt-0.5 drop-shadow-sm",
                },
                "Offers",
              ),
            ),
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(e(App));
    </script>
